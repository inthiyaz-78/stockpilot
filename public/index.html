<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StockPilot — Inventory &amp; Supply Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: { brand: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' } }, boxShadow: { soft:'0 10px 30px -12px rgba(99,102,241,0.25)' } } } };
</script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
  body { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
  .scrollbar::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:999px; }
  .modal-backdrop { backdrop-filter: blur(4px); }
  @keyframes fadeIn { from {opacity:0; transform:translateY(6px)} to {opacity:1; transform:none} }
  .fade-in { animation: fadeIn .25s ease-out; }
  @keyframes slideIn { from {transform:translateX(-100%)} to {transform:none} }
  .slide-in { animation: slideIn .2s ease-out; }
  .table-row:hover td { background:#f8fafc; }
  .kpi { transition: transform .15s ease, box-shadow .15s ease; }
  .kpi:hover { transform: translateY(-2px); box-shadow: 0 12px 28px -14px rgba(99,102,241,.35); }
  @keyframes floatY { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
  .float-y { animation: floatY 6s ease-in-out infinite; }
  @keyframes blob { 0%,100% { transform: translate(0,0) scale(1) } 33% { transform: translate(40px,-30px) scale(1.12) } 66% { transform: translate(-30px,20px) scale(.92) } }
  .blob { animation: blob 16s ease-in-out infinite; }
  .blob-2 { animation: blob 20s ease-in-out infinite reverse; }
  @keyframes fadeUp { from { opacity:0; transform: translateY(22px) } to { opacity:1; transform:none } }
  .fade-up { opacity:0; animation: fadeUp .8s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes gradientShift { 0%,100% { background-position: 0% 50% } 50% { background-position: 100% 50% } }
  .gradient-text { background: linear-gradient(90deg,#818cf8,#a78bfa,#38bdf8,#818cf8); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: gradientShift 6s ease infinite; }
  @keyframes logoPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(99,102,241,.55), 0 18px 50px -12px rgba(99,102,241,.6) } 50% { box-shadow: 0 0 0 16px rgba(99,102,241,0), 0 18px 60px -8px rgba(129,140,248,.75) } }
  .logo-pulse { animation: logoPulse 3s ease-in-out infinite; }
  @keyframes spinSlow { to { transform: rotate(360deg) } }
  .ring-spin { animation: spinSlow 14s linear infinite; }
  @keyframes shine { 0% { transform: translateX(-120%) } 60%,100% { transform: translateX(320%) } }
  .btn-shine { position: relative; overflow: hidden; }
  .btn-shine::after { content:''; position:absolute; top:0; left:0; width:40%; height:100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent); transform: translateX(-120%); }
  .btn-shine:hover::after { animation: shine 1s ease; }
  @keyframes marquee { from { transform: translateX(0) } to { transform: translateX(-50%) } }
  .marquee { animation: marquee 26s linear infinite; }
  .grid-bg { background-image: linear-gradient(rgba(148,163,184,.09) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,.09) 1px, transparent 1px); background-size: 44px 44px; }
  .glass { background: rgba(255,255,255,.92); backdrop-filter: blur(18px); }

  /* ===== Modern Interactive (compact) ===== */
  .magnetic { transition:transform .12s cubic-bezier(.2,.7,.2,1), box-shadow .12s ease; }
  .magnetic:active { transform:scale(.96); transition:transform .05s; }
  .stagger-in > * { opacity:0; transform:translateY(16px); animation:staggerUp .4s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes staggerUp { to{opacity:1;transform:none} }
  .stagger-in > *:nth-child(1){animation-delay:0ms}
  .stagger-in > *:nth-child(2){animation-delay:50ms}
  .stagger-in > *:nth-child(3){animation-delay:100ms}
  .stagger-in > *:nth-child(4){animation-delay:150ms}
  .stagger-in > *:nth-child(5){animation-delay:200ms}
  .stagger-in > *:nth-child(6){animation-delay:250ms}
  .glass-card { background:rgba(255,255,255,.75); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.35); }
  .shadow-layered { box-shadow:0 2px 8px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.05); }
  .counter { display:inline-block; animation:countUp .5s cubic-bezier(.2,.7,.2,1) backwards; }
  @keyframes countUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .ripple { position:relative; overflow:hidden; }
  .ripple::after { content:''; position:absolute; inset:0; background:rgba(255,255,255,.3); transform:scale(0); animation:rippleOut .3s ease-out; pointer-events:none; }
  @keyframes rippleOut { to{transform:scale(4);opacity:0} }
  .interactive-row:hover { background:rgba(99,102,241,.05); transform:translateX(3px); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; } }
  @media (hover: none) { .magnetic:hover, .interactive-row:hover { transform:none; box-shadow:none; } }
  :focus-visible { outline:2px solid #6366f1; outline-offset:2px; }

  /* ===== Dark Mode ===== */
  .dark body { background:#0f172a; color:#e2e8f0; }
  .dark .bg-slate-50 { background:#0f172a !important; }
  .dark .bg-white { background:#1e293b !important; }
  .dark .bg-slate-100 { background:#334155 !important; }
  .dark .bg-slate-200 { background:#334155 !important; }
  .dark .text-slate-800 { color:#e2e8f0 !important; }
  .dark .text-slate-700 { color:#cbd5e1 !important; }
  .dark .text-slate-600 { color:#94a3b8 !important; }
  .dark .text-slate-500 { color:#64748b !important; }
  .dark .text-slate-400 { color:#64748b !important; }
  .dark .border-slate-100 { border-color:#334155 !important; }
  .dark .border-slate-200 { border-color:#334155 !important; }
  .dark .hover\:bg-slate-50:hover { background:#334155 !important; }
  .dark .hover\:bg-slate-100:hover { background:#334155 !important; }
  .dark .bg-white\/5 { background:rgba(255,255,255,.05) !important; }
  .dark .bg-white\/10 { background:rgba(255,255,255,.1) !important; }
  .dark .hover\:bg-white\/5:hover { background:rgba(255,255,255,.05) !important; }
  .dark .hover\:bg-white\/10:hover { background:rgba(255,255,255,.1) !important; }
  .dark .bg-slate-50\/50 { background:rgba(30,41,59,.5) !important; }
  .dark .bg-brand-50 { background:#1e1b4b !important; }
  .dark .bg-brand-100 { background:#312e81 !important; }
  .dark .bg-emerald-50 { background:#052e16 !important; }
  .dark .bg-emerald-100 { background:#064e2b !important; }
  .dark .bg-amber-50 { background:#451a03 !important; }
  .dark .bg-amber-100 { background:#78350f !important; }
  .dark .bg-rose-50 { background:#450a0a !important; }
  .dark .bg-rose-100 { background:#881337 !important; }
  .dark .bg-sky-50 { background:#0c4a6e !important; }
  .dark .bg-violet-50 { background:#2e1065 !important; }
  .dark .bg-indigo-50 { background:#1e1b4b !important; }
  .dark .bg-pink-50 { background:#500724 !important; }
  .dark .bg-orange-50 { background:#431407 !important; }
  .dark .bg-red-50 { background:#450a0a !important; }
  .dark .bg-green-50 { background:#052e16 !important; }
  .dark .bg-blue-50 { background:#1e3a5f !important; }
  .dark .shadow-sm { box-shadow: 0 1px 2px 0 rgb(0 0 0 / .3) !important; }
  .dark .shadow-soft { box-shadow: 0 10px 25px -5px rgb(0 0 0 / .4), 0 8px 10px -6px rgb(0 0 0 / .2) !important; }
  .dark .ring-white\/10 { box-shadow: 0 0 0 2px rgba(255,255,255,.1) !important; }
  .dark .modal-backdrop { background:rgba(0,0,0,.7) !important; }
  .dark input, .dark select, .dark textarea { background:#1e293b !important; border-color:#334155 !important; color:#e2e8f0 !important; }
  .dark input:focus, .dark select:focus, .dark textarea:focus { background:#0f172a !important; border-color:#6366f1 !important; }
  .dark .table-row:hover td { background:#1e293b !important; }
  .dark .scrollbar::-webkit-scrollbar-thumb { background:#475569 !important; }
  .dark .interactive-row:hover { background:rgba(99,102,241,.1); }

  /* ===== Print (Bill PDF) ===== */
  @media print {
    body { background:#fff !important; }
    body * { visibility:hidden; }
    .bill-content, .bill-content * { visibility:visible; }
    .bill-content { position:absolute; left:0; top:0; width:100%; padding:20px; }
    .no-print { display:none !important; }
    .modal-backdrop { display:none !important; }
  }
</style>
</head>
<body class="bg-slate-50 text-slate-800">
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
